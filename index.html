<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Desktop - Viewer</title>
    <style>
        body { margin: 0; background-color: #1e1e1e; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; overflow-x: hidden; }
        h2 { margin: 10px 0; }
        #screen-container { border: 2px solid #555; padding: 0; background: #000; position: relative; }
        /* touch-action: none e crucial pt telefon, oprește scroll-ul accidental când tragi pe imagine (Touchpad) */
        #screen { width: 1024px; max-width: 100vw; height: auto; cursor: crosshair; display: block; touch-action: none; }
        
        #tools-menu {
            position: fixed; right: -220px; top: 60px; width: 200px; background: #2d2d2d;
            padding: 15px; transition: right 0.3s ease; border: 1px solid #555;
            border-radius: 10px 0 0 10px; box-shadow: -2px 0 10px rgba(0,0,0,0.5); z-index: 1000;
        }
        #tools-menu.open { right: 0; }
        
        .toggle-btn {
            position: absolute; left: -45px; top: 15px; width: 45px; height: 45px;
            background: #0078D7; color: white; border: none; font-size: 24px;
            cursor: pointer; border-radius: 10px 0 0 10px; box-shadow: -2px 0 5px rgba(0,0,0,0.3);
        }
        
        .tool-btn {
            display: block; width: 100%; margin-bottom: 10px; padding: 10px; background: #444;
            color: white; border: 1px solid #666; border-radius: 5px; cursor: pointer; font-size: 16px;
        }
        .tool-btn:active { background: #666; }
        .mode-btn { background: #28a745; border-color: #1e7e34; }

        #mobile-keyboard { position: absolute; opacity: 0; top: -1000px; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h2>Panou de Control</h2>
    
    <div id="screen-container">
        <img id="screen" alt="Aștept semnal video de la Host..." />
    </div>

    <!-- Meniul lateral -->
    <div id="tools-menu">
        <button class="toggle-btn" onclick="toggleMenu()">⚙️</button>
        <button class="tool-btn mode-btn" id="mode-toggle" onclick="toggleControlMode()">👆 Mod: Touch Direct</button>
        <button class="tool-btn" onclick="openMobileKeyboard()">⌨️ Tastatură Mobil</button>
        <hr style="border-color: #555; margin: 15px 0;">
        <button class="tool-btn" onclick="sendHotkey(['win'])">Start (Win)</button>
        <button class="tool-btn" onclick="sendHotkey(['ctrl', 'c'])">Copiază (Ctrl+C)</button>
        <button class="tool-btn" onclick="sendHotkey(['ctrl', 'v'])">Lipește (Ctrl+V)</button>
        <button class="tool-btn" onclick="sendHotkey(['alt', 'tab'])">Alt + Tab</button>
        <button class="tool-btn" onclick="sendKey('enter')">Enter</button>
        <button class="tool-btn" onclick="sendKey('backspace')">Backspace</button>
    </div>

    <input type="text" id="mobile-keyboard" autocomplete="off" />

    <script>
        const RENDER_URL = 'https://pair-pair.onrender.com';
        const socket = io(RENDER_URL);
        const screenImg = document.getElementById('screen');
        const mobileInput = document.getElementById('mobile-keyboard');

        // Variabile pentru modurile de control pe mobil
        let controlMode = 'direct'; // Poate fi 'direct' sau 'touchpad'
        let lastTouchX = 0, lastTouchY = 0;
        let touchMoved = false;

        socket.on('screen-data', (base64Image) => {
            screenImg.src = 'data:image/jpeg;base64,' + base64Image;
        });

        function toggleMenu() { document.getElementById('tools-menu').classList.toggle('open'); }

        // Schimbarea modului din meniu
        function toggleControlMode() {
            const btn = document.getElementById('mode-toggle');
            if (controlMode === 'direct') {
                controlMode = 'touchpad';
                btn.innerHTML = '🖱️ Mod: Touchpad';
                btn.style.background = '#007bff'; // Albastru
            } else {
                controlMode = 'direct';
                btn.innerHTML = '👆 Mod: Touch Direct';
                btn.style.background = '#28a745'; // Verde
            }
            toggleMenu(); // Ascundem meniul ca să testezi direct
        }

        /* --- LOGICĂ TOUCH PENTRU TELEFON --- */
        screenImg.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                touchMoved = false;
            }
        }, { passive: false });

        screenImg.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Oprește pagina să facă scroll când tragi de imagine
            touchMoved = true;
            if (controlMode === 'touchpad' && e.touches.length > 0) {
                let currentX = e.touches[0].clientX;
                let currentY = e.touches[0].clientY;
                
                // Multiplicator (x1.5) pentru a mișca cursorul mai rapid pe ecranul mare al PC-ului
                let dx = (currentX - lastTouchX) * 1.5; 
                let dy = (currentY - lastTouchY) * 1.5;
                
                socket.emit('remote-command', { type: 'mousemove_rel', dx: dx, dy: dy });
                
                lastTouchX = currentX;
                lastTouchY = currentY;
            }
        }, { passive: false });

        screenImg.addEventListener('touchend', (e) => {
            // Dacă doar ai apăsat (fără să tragi/glisezi) -> e un Click
            if (!touchMoved) {
                if (controlMode === 'direct') {
                    const rect = screenImg.getBoundingClientRect();
                    const clickX = (lastTouchX - rect.left) / rect.width;
                    const clickY = (lastTouchY - rect.top) / rect.height;
                    socket.emit('remote-command', { type: 'click', x: clickX, y: clickY });
                } else {
                    // În mod touchpad dăm click fix unde este deja cursorul
                    socket.emit('remote-command', { type: 'click' });
                }
            }
        });

        /* --- LOGICĂ CLICK PENTRU LAPTOP --- */
        screenImg.addEventListener('click', (e) => {
            if (controlMode === 'direct') {
                const rect = screenImg.getBoundingClientRect();
                const clickX = (e.clientX - rect.left) / rect.width;
                const clickY = (e.clientY - rect.top) / rect.height;
                socket.emit('remote-command', { type: 'click', x: clickX, y: clickY });
            } else {
                socket.emit('remote-command', { type: 'click' });
            }
        });

        /* --- LOGICĂ TASTATURĂ --- */
        function sendKey(key) { socket.emit('remote-command', { type: 'key', key: key }); }
        function sendHotkey(keys) { socket.emit('remote-command', { type: 'hotkey', keys: keys }); }

        const keyMap = { 'control': 'ctrl', 'meta': 'win', 'escape': 'esc', ' ': 'space', 'arrowup': 'up', 'arrowdown': 'down', 'arrowleft': 'left', 'arrowright': 'right' };
        document.addEventListener('keydown', (e) => {
            if(['Tab', 'Alt', 'Control', 'Meta'].includes(e.key)) e.preventDefault();
            let key = e.key.toLowerCase();
            key = keyMap[key] || key;
            sendKey(key);
        });

        function openMobileKeyboard() {
            mobileInput.focus();
            mobileInput.click();
            toggleMenu();
        }

        mobileInput.addEventListener('input', (e) => {
            if (e.data) { sendKey(e.data.toLowerCase()); }
            mobileInput.value = ''; 
        });

        mobileInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' || e.key === 'Enter') {
                sendKey(e.key.toLowerCase());
            }
        });
    </script>
</body>
</html>
